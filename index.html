    <script>
      (function () {
        function isWalletExtensionError(msg, stack, filename) {
          var text = ((msg || '') + ' ' + (stack || '') + ' ' + (filename || '')).toLowerCase();
          return (
            text.indexOf('metamask') !== -1 ||
            text.indexOf('inpage.js') !== -1 ||
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('moz-extension://') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && (event.message || (event.error && event.error.message));
            var stack = event && event.error && event.error.stack;
            var filename = event && event.filename;
            if (isWalletExtensionError(msg, stack, filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = typeof reason === 'string' ? reason : reason && reason.message;
            var stack = reason && reason.stack;
            if (isWalletExtensionError(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
