<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" fill="none">
  <defs>
    <!-- Specular Silver-White Upper Left Bevel Gradient -->
    <linearGradient id="xFacetBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#DCE7F3" />
      <stop offset="80%" stop-color="#8FA4BC" />
      <stop offset="100%" stop-color="#536882" />
    </linearGradient>

    <!-- Brushed Titanium Mid-Tone Metallic Gradient -->
    <linearGradient id="xFacetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EB2C8" />
      <stop offset="48%" stop-color="#566B84" />
      <stop offset="100%" stop-color="#223042" />
    </linearGradient>

    <!-- Deep Gunmetal / Obsidian Shadow Facet Gradient -->
    <linearGradient id="xFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3A4E" />
      <stop offset="50%" stop-color="#121C2B" />
      <stop offset="100%" stop-color="#070C14" />
    </linearGradient>

    <!-- Icy Cyan-Blue Rim Reflection Gradient -->
    <linearGradient id="xCyanEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- AVENIX Letter Face Metallic Brushed Steel Gradient -->
    <linearGradient id="wordFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DAE5F0" />
      <stop offset="32%" stop-color="#9BB0C5" />
      <stop offset="68%" stop-color="#576B82" />
      <stop offset="100%" stop-color="#2B3A4D" />
    </linearGradient>

    <!-- AVENIX 3D Extrusion / Bevel Base Gradient -->
    <linearGradient id="wordBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475B73" />
      <stop offset="55%" stop-color="#172232" />
      <stop offset="100%" stop-color="#080E17" />
    </linearGradient>

    <!-- Subtle Metallic Drop Shadow -->
    <filter id="logoDepth" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#030712" flood-opacity="0.42" />
    </filter>
  </defs>

  <g filter="url(#logoDepth)">
    <!-- ===================================================== -->
    <!-- 3D CHISEL-BEVELED METALLIC 'X' EMBLEM (LEFT)          -->
    <!-- ===================================================== -->
    <g transform="translate(18, 12)">
      <!-- Outer Icy-Cyan Rim Highlight on Right/Inner Edges -->
      <polygon points="154,10 222,10 154,98 224,186 156,186 112,128 68,186 4,186 74,98 6,10 72,10 114,68" fill="url(#xCyanEdge)" />

      <!-- Main Outer Dark Metallic Base Shell -->
      <polygon points="4,10 70,10 112,68 154,10 218,10 150,98 220,186 154,186 112,128 70,186 4,186 72,98" fill="url(#xFacetDark)" />

      <!-- TOP-LEFT ARM OF X: 3D Chisel Facets -->
      <!-- Bright Specular Inner-Left Facet -->
      <polygon points="4,10 50,42 112,98 72,98" fill="url(#xFacetMid)" />
      <!-- High-Gloss Silver-White Upper Face -->
      <polygon points="4,10 70,10 112,68 112,98 50,42" fill="url(#xFacetBright)" />
      <!-- Dark Inner Bevel Slope -->
      <polygon points="70,10 112,68 112,98 88,52" fill="url(#xFacetDark)" />

      <!-- TOP-RIGHT ARM OF X: 3D Chisel Facets + Recessed Groove -->
      <polygon points="154,10 218,10 174,42 112,98 112,68" fill="url(#xFacetMid)" />
      <polygon points="218,10 150,98 112,98 174,42" fill="url(#xFacetDark)" />
      <!-- Recessed Tech Channel Inside Top-Right Arm -->
      <polygon points="160,20 198,20 148,84 126,84" fill="#0B1320" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.55" />
      <!-- Cyan Specular Edge Line on Top-Right Outer Slope -->
      <polyline points="218,10 150,98 220,186" fill="none" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round" />

      <!-- BOTTOM-LEFT ARM OF X: 3D Chisel Facets -->
      <polygon points="72,98 112,98 50,154 4,186" fill="url(#xFacetDark)" />
      <polygon points="112,98 112,128 70,186 4,186 50,154" fill="url(#xFacetMid)" />
      <polygon points="112,98 92,144 70,186 112,128" fill="url(#xFacetDark)" />

      <!-- BOTTOM-RIGHT ARM OF X: 3D Chisel Facets -->
      <polygon points="112,98 150,98 220,186 174,154" fill="url(#xFacetMid)" />
      <polygon points="112,98 174,154 220,186 154,186 112,128" fill="url(#xFacetDark)" />
      <!-- Bright Silver-Blue Inner Facet on Bottom-Right Arm -->
      <polygon points="126,112 168,150 196,176 158,176 118,124" fill="url(#xFacetMid)" />

      <!-- Crisp Specular Center Ridge Lines (X Vertex Crosshair) -->
      <line x1="50" y1="42" x2="174" y2="154" stroke="#E2E8F0" stroke-width="1.4" stroke-opacity="0.7" />
      <line x1="174" y1="42" x2="50" y2="154" stroke="#94A3B8" stroke-width="1.3" stroke-opacity="0.65" />
      <line x1="112" y1="68" x2="112" y2="128" stroke="#F8FAFC" stroke-width="1.6" stroke-opacity="0.85" />
    </g>

    <!-- ===================================================== -->
    <!-- 3D BEVELED METALLIC 'AVENIX' WORDMARK (RIGHT)         -->
    <!-- ===================================================== -->
    <g transform="translate(272, 58)">
      <!-- LETTER A -->
      <g transform="translate(0, 0)">
        <!-- 3D Extruded Bevel Base -->
        <path d="M44 0 L76 0 L118 116 L84 116 L75 90 L39 90 L30 116 L-4 116 Z" fill="url(#wordBevel)" transform="translate(3, 4)" />
        <!-- Metallic Face -->
        <path fill-rule="evenodd" clip-rule="evenodd" d="M44 0 L76 0 L116 114 L86 114 L77 86 L39 86 L30 114 L0 114 L44 0 Z M58 28 L46 64 L70 64 L58 28 Z" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.45" />
        <!-- Top Specular Highlight -->
        <line x1="45" y1="1.5" x2="75" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
      </g>

      <!-- LETTER V -->
      <g transform="translate(106, 0)">
        <polygon points="0,0 32,0 58,78 84,0 116,0 72,116 44,116" fill="url(#wordBevel)" transform="translate(3, 4)" />
        <polygon points="0,0 30,0 58,82 86,0 116,0 73,114 43,114" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.45" />
        <line x1="2" y1="1.5" x2="29" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
        <line x1="87" y1="1.5" x2="114" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
      </g>

      <!-- LETTER E -->
      <g transform="translate(228, 0)">
        <polygon points="0,0 88,0 88,24 28,24 28,44 80,44 80,68 28,68 28,90 90,90 90,114 0,114" fill="url(#wordBevel)" transform="translate(3, 4)" />
        <polygon points="0,0 88,0 88,23 28,23 28,45 80,45 80,67 28,67 28,91 90,91 90,114 0,114" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.45" />
        <line x1="1" y1="1.5" x2="87" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
      </g>

      <!-- LETTER N -->
      <g transform="translate(334, 0)">
        <polygon points="0,0 28,0 74,68 74,0 102,0 102,114 74,114 28,46 28,114 0,114" fill="url(#wordBevel)" transform="translate(3, 4)" />
        <polygon points="0,0 27,0 74,70 74,0 102,0 102,114 75,114 28,44 28,114 0,114" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.45" />
        <line x1="1" y1="1.5" x2="26" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
        <line x1="75" y1="1.5" x2="101" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
      </g>

      <!-- LETTER I -->
      <g transform="translate(454, 0)">
        <rect x="3" y="4" width="28" height="114" fill="url(#wordBevel)" />
        <rect x="0" y="0" width="28" height="114" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.45" />
        <line x1="1" y1="1.5" x2="27" y2="1.5" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
        <!-- Icy-Cyan Vertical Specular Rim on Right Edge of I -->
        <line x1="28" y1="2" x2="28" y2="112" stroke="#7DD3FC" stroke-width="1.6" stroke-opacity="0.85" />
      </g>

      <!-- LETTER X (with signature Icy-Cyan Inner Bevel Glow matching uploaded logo) -->
      <g transform="translate(492, 0)">
        <!-- Cyan Rim Glow Base -->
        <polygon points="0,0 32,0 56,36 80,0 112,0 74,56 114,114 82,114 56,76 30,114 0,114 38,56" fill="url(#xCyanEdge)" transform="translate(-2, 1)" />
        <!-- Dark 3D Extrusion -->
        <polygon points="0,0 32,0 56,36 80,0 112,0 74,56 114,114 82,114 56,76 30,114 0,114 38,56" fill="url(#wordBevel)" transform="translate(3, 4)" />
        <!-- Metallic Face -->
        <polygon points="0,0 31,0 56,37 81,0 112,0 73,56 113,114 82,114 56,75 30,114 0,114 39,56" fill="url(#wordFace)" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.5" />
        <!-- Inner Facet Dark Contrast & Cyan Highlight -->
        <polygon points="10,6 28,6 56,48 84,6 102,6 66,56 103,108 85,108 56,64 27,108 9,108 46,56" fill="url(#xFacetDark)" />
        <polyline points="81,0 56,37 31,0" fill="none" stroke="#7DD3FC" stroke-width="2" />
        <polyline points="30,114 56,75 82,114" fill="none" stroke="#38BDF8" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
